<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberForge Security</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- AUTHENTICATION VIEW (Sign In & Sign Up) -->
    <div id="auth-view" class="glass-panel">
        <div class="logo">🛡️ CyberForge</div>

        <div class="tab-container">
            <button id="tab-login" class="tab active-tab">Sign In</button>
            <button id="tab-register" class="tab">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <input type="text" id="login-user" placeholder="Username" required>
            <input type="password" id="login-pass" placeholder="Password" required>
            <button type="submit" class="glow-btn">Authenticate</button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="registerForm" style="display: none;">
            <input type="text" id="reg-user" placeholder="Choose a Username" required>
            <input type="password" id="reg-pass" placeholder="Create a Password" required>
            <button type="submit" class="glow-btn">Create Account</button>
        </form>

        <p id="auth-message" class="system-text"></p>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view" class="glass-panel" style="display: none; max-width: 600px;">
        <div class="header">
            <h2>Welcome, <span id="display-name" class="highlight"></span></h2>
            <button id="logoutBtn" class="secondary-btn">Disconnect</button>
        </div>

        <div class="card">
            <h3>Initiate Secure Transfer</h3>
            <form id="transferForm">
                <input type="text" id="recipient" placeholder="Recipient Account (e.g., ACC-123)" required>
                <input type="number" id="amount" placeholder="Amount (INR)" required>
                <button type="submit" class="glow-btn">Execute Transfer</button>
            </form>
            <p id="transfer-message" class="system-text"></p>
        </div>

        <div class="card">
            <h3>Audit Log</h3>
            <ul id="history-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
