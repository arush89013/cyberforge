<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberForge - Secure Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="cf-login-page">
        <!-- LOGO -->
        <div class="cf-login-logo">
            <div class="cf-login-icon">🔐</div>
            <h1>Cyber<span>Forge</span></h1>
            <p>Secure payments. Safer you.</p>
        </div>

        <!-- AUTH CARD -->
        <section class="cf-login-card">
            
            <!-- TOGGLE BUTTONS -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button id="tabLogin" class="cf-login-button" style="margin-top: 0;">Sign In</button>
                <button id="tabRegister" class="cf-login-button" style="margin-top: 0; background: #15191e; border: 1px solid #303943; color: #8993a0;">Sign Up</button>
            </div>

            <div class="login-heading">
                <h2 id="authTitle">Welcome back</h2>
                <p id="authSubtitle">Sign in to access your secure account</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <button type="submit" id="loginBtn" class="cf-login-button">Sign in securely</button>
            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" class="hidden">
                <label for="regUsername">Choose Username</label>
                <input type="text" id="regUsername" placeholder="Create a username" required>

                <label for="regPassword">Create Password</label>
                <input type="password" id="regPassword" placeholder="Create a strong password" required>

                <button type="submit" id="regBtn" class="cf-login-button">Create Account</button>
            </form>

            <p id="auth-message" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>

            <!-- SECURITY INFORMATION -->
            <div class="cf-login-protection">
                <div>🛡️</div>
                <div>
                    <strong>CyberForge Protection</strong>
                    <p>Risk analysis + hardware authentication</p>
                </div>
            </div>
        </section>

        <p class="cf-login-footer">Protected by CyberForge Security</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
